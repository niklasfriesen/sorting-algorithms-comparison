[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sorting-algorithms-comparison"
version = "0.1.0"
description = "Runtime and complexity comparison of different sorting algorithms with benchmarks across different input sizes."
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
]

[tool.setuptools.packages.find]
include = ["src*"]